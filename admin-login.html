<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Portal Login | TradePilot</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <style>
    body {
      background-color: #0F172A;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">
  <div class="max-w-md w-full">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4 shadow-lg shadow-indigo-500/10">
        <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">TradePilot Admin Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Authorized Administrator Access Only</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl">
      <form id="admin-login-form" class="space-y-5">
        <!-- Error Alert -->
        <div id="login-error" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-medium flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">error</span>
          <span id="login-error-msg">Invalid administrator credentials.</span>
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Email</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
            <input type="email" id="admin-email" required placeholder="admin@tradepilot.com" class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"/>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
            <input type="password" id="admin-password" required placeholder="••••••••••••" class="w-full pl-10 pr-10 py-3 bg-slate-900/80 border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"/>
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
              <span class="material-symbols-outlined text-lg" id="pw-icon">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login-submit" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center gap-2">
          <span>Authenticate Admin</span>
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <p class="text-[11px] text-slate-500 leading-relaxed">
          🔒 Encrypted Admin Authentication • Role-Based Access Control
        </p>
        <a href="/signin" class="inline-block mt-3 text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors">
          ← Back to User Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="assets/auth-guard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('admin-login-form');
      const errorDiv = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('btn-login-submit');
      const togglePwBtn = document.getElementById('toggle-pw');
      const pwInput = document.getElementById('admin-password');
      const pwIcon = document.getElementById('pw-icon');

      // Check if already logged in as admin
      const token = localStorage.getItem('tradepilot_admin_token') || localStorage.getItem('tradepilot_token');
      const userStr = localStorage.getItem('tradepilot_user');
      if (token && userStr) {
        try {
          const u = JSON.parse(userStr);
          if (u.role === 'admin') {
            window.location.href = '/admin';
            return;
          }
        } catch (e) {}
      }

      togglePwBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        pwIcon.textContent = isPw ? 'visibility_off' : 'visibility';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Authenticating...</span>
        `;

        const email = document.getElementById('admin-email').value;
        const password = pwInput.value;

        try {
          const res = await fetch('/api/admin/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (!res.ok) {
            errorMsg.textContent = data.error || 'Authentication failed.';
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Authenticate Admin</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
            return;
          }

          localStorage.setItem('tradepilot_admin_token', data.token);
          localStorage.setItem('tradepilot_token', data.token);
          localStorage.setItem('tradepilot_user', JSON.stringify(data.user));

          window.location.href = '/admin';
        } catch (err) {
          errorMsg.textContent = 'Server connection error. Please try again.';
          errorDiv.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Authenticate Admin</span><span class="material-symbols-outlined text-lg">arrow_forward</span>`;
        }
      });
    });
  </script>
</body>
</html>
